[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "insufficient-effort"
version = "2.7.4"
authors = [{ name = "Cameron Lyons", email = "cameron.lyons2@gmail.com" }]
description = "Python library for detecting Insufficient Effort Responding (IER) in survey data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.0,<2.5"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

[project.optional-dependencies]
full = []
plot = ["matplotlib>=3.8.0,<4"]

[dependency-groups]
test = [
    "matplotlib>=3.8.0,<4",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0.0,<8",
    "hypothesis>=6.150.0,<7",
]
integration = [
    { include-group = "test" },
    "pandas>=2.2.0,<4",
    "polars>=1.0.0,<2",
]
lint = [
    "matplotlib>=3.8.0,<4",
    "mypy>=1.19.0,<3",
    "ruff>=0.14.0,<1",
]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=0.26.0,<2",
]
security = [
    "pip-audit>=2.9.0,<3",
]

[project.scripts]
ier = "ier.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ier = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/Cameron-Lyons/ier"
"Bug Tracker" = "https://github.com/Cameron-Lyons/ier/issues"
"Changelog" = "https://github.com/Cameron-Lyons/ier/blob/main/CHANGELOG.md"
"Documentation" = "https://cameron-lyons.github.io/ier/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -Werror"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/ier"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "S", "PLE", "PLC", "PLW"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/ier/_optional_imports.py" = ["PLC0415"]
"scripts/smoke_test_install.py" = ["S603"]
"tests/**" = ["PLC0415", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["ier"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
