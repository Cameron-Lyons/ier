name: Feature request
description: Propose an API, index, or tooling improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired API, index, CLI flag, or docs change.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, R package functions, or prior art (optional).
