name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Match tag to project version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME" pyproject.toml

  test:
    name: Run tests before release
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Build package
        run: uv build

      - name: Verify package metadata
        run: uv run --no-project python scripts/check_dist.py dist/*

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke-test built wheel
        run: uv run --isolated --no-project --with dist/*.whl python scripts/smoke_test_install.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: changelog
        run: |
          NOTES="$(mktemp)"
          {
            echo "## What's Changed"
            echo
            if PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
              git log "${PREV}..HEAD" --pretty=format:"* %s (%h)"
            else
              echo "* Initial release"
            fi
            echo
            echo
            echo "See [CHANGELOG.md](https://github.com/Cameron-Lyons/ier/blob/main/CHANGELOG.md) for curated notes."
          } > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          files: dist/*
          generate_release_notes: true
