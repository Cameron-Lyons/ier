name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Match tag to project version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME" pyproject.toml

  ci:
    name: Test and build distribution
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: changelog
        run: |
          NOTES="$(mktemp)"
          {
            echo "## What's Changed"
            echo
            if PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
              git log "${PREV}..HEAD" --pretty=format:"* %s (%h)"
            else
              echo "* Initial release"
            fi
            echo
            echo
            echo "See [CHANGELOG.md](https://github.com/Cameron-Lyons/ier/blob/main/CHANGELOG.md) for curated notes."
          } > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          files: dist/*
          generate_release_notes: true
