name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group lint --python 3.14

      - name: Run Ruff linter
        run: uv run --no-sync ruff check --output-format=github .

      - name: Run Ruff formatter check
        run: uv run --no-sync ruff format --check .

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group lint --group artifact --python 3.14

      - name: Run mypy
        run: uv run --no-sync mypy src/ier benchmarks scripts

      - name: Verify public consumer type contracts
        run: uv run --no-sync python scripts/check_public_typing.py
