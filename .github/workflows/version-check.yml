name: Version Check

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      skip:
        description: "Skip version comparison for non-release PRs"
        required: false
        type: boolean
        default: false

jobs:
  version-check:
    name: Check version updated
    runs-on: ubuntu-latest
    if: >
      github.actor != 'dependabot[bot]' &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]') &&
      !(
        (github.event_name == 'workflow_call' && inputs.skip) ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'no-version-bump'))
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require project and lock versions to match
        run: python3 scripts/check_lock_version.py

      - name: Detect whether a version bump is required
        id: scope
        run: |
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^src/'; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "Source under src/ changed — version bump required."
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "No src/ changes — version bump not required."
          fi

      - name: Require a newer semantic version
        if: steps.scope.outputs.needs_bump == 'true'
        run: |
          MAIN_PYPROJECT="$(mktemp)"
          git show origin/main:pyproject.toml > "$MAIN_PYPROJECT"
          python scripts/check_version.py "$MAIN_PYPROJECT" pyproject.toml
