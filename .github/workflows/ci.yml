name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Require project and lock versions to match
        run: uv run --no-project --python ${{ matrix.python-version }} python scripts/check_lock_version.py

      - name: Install dependencies
        run: uv sync --locked --group integration --python ${{ matrix.python-version }}

      - name: Verify test interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-sync python -c "import os, sys; actual = '.'.join(map(str, sys.version_info[:2])); assert actual == os.environ['EXPECTED_PYTHON'], actual"

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ -v --cov=ier --cov-report=xml --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  numpy-compatibility:
    name: Test ${{ matrix.numpy-mode }} NumPy on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            numpy-mode: minimum
            numpy-specifier: numpy==1.26.0
          - python-version: "3.14"
            numpy-mode: latest
            numpy-specifier: numpy>=1.26.0,<2.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked integration tools
        run: uv sync --locked --group integration --python ${{ matrix.python-version }}

      - name: Install supported NumPy boundary
        env:
          NUMPY_SPECIFIER: ${{ matrix.numpy-specifier }}
        run: uv pip install --upgrade --python .venv/bin/python "$NUMPY_SPECIFIER"

      - name: Verify dependency environment
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          NUMPY_MODE: ${{ matrix.numpy-mode }}
        run: |
          uv run --no-sync python -c "import os, sys, numpy; actual = '.'.join(map(str, sys.version_info[:2])); assert actual == os.environ['EXPECTED_PYTHON'], actual; version = tuple(map(int, numpy.__version__.split('.')[:2])); assert (1, 26) <= version < (2, 5), numpy.__version__; assert os.environ['NUMPY_MODE'] != 'minimum' or numpy.__version__ == '1.26.0', numpy.__version__"

      - name: Run complete suite with supported NumPy boundary
        run: uv run --no-sync pytest tests/ -v --cov=ier --cov-report=term-missing --cov-fail-under=95

  build:
    name: Build distribution
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: [test, numpy-compatibility]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Build package
        run: uv build --python 3.14

      - name: Verify package metadata
        run: uv run --locked --only-group artifact --python 3.14 python scripts/check_dist.py dist/*

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke-test built wheel
        run: uv run --isolated --no-project --python 3.14 --with dist/*.whl python scripts/smoke_test_install.py

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --python 3.14 --with dist/*.tar.gz python scripts/smoke_test_install.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  packaged-tests:
    name: Test installed wheel with bundled source-distribution tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dist/*"

      - name: Set up Python
        run: uv python install 3.14

      - name: Run complete suite outside the checkout
        shell: bash
        run: |
          ARTIFACT_ROOT="$(pwd)/dist"
          PACKAGED_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PACKAGED_ROOT"' EXIT
          uv run --no-project --python 3.14 python - "$ARTIFACT_ROOT" "$PACKAGED_ROOT" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          artifacts = Path(sys.argv[1])
          sdists = list(artifacts.glob("*.tar.gz"))
          wheels = list(artifacts.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              raise RuntimeError("Expected exactly one tested wheel and source distribution")
          destination = Path(sys.argv[2])
          with tarfile.open(sdists[0]) as archive:
              archive.extractall(destination, filter="data")
          roots = list(destination.iterdir())
          if len(roots) != 1 or not roots[0].is_dir():
              raise RuntimeError("Source distribution must have one root directory")
          PY
          cd "$PACKAGED_ROOT"/*
          uv sync --locked --group integration --group artifact --no-install-project --python 3.14
          uv pip install --no-deps "$ARTIFACT_ROOT"/*.whl
          uv run --no-sync python -c "import sys, ier; from pathlib import Path; location = Path(ier.__file__).resolve(); assert location.is_relative_to(Path(sys.prefix).resolve()), f'Package imported outside test environment: {location}'"
          uv run --no-sync pytest tests/ -v --cov=ier --cov-report=term-missing --cov-fail-under=95
