name: Veto

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  lint:
    uses: ./.github/workflows/lint.yml

  security:
    uses: ./.github/workflows/security.yml

  docs:
    uses: ./.github/workflows/docs.yml

  version-check:
    uses: ./.github/workflows/version-check.yml
    with:
      skip: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-version-bump') }}

  veto:
    name: Veto
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs: [ci, lint, security, docs, version-check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.version-check.result }}" != "success" && "${{ needs.version-check.result }}" != "skipped" ]]; then
            echo "CI: ${{ needs.ci.result }}"
            echo "Lint: ${{ needs.lint.result }}"
            echo "Security: ${{ needs.security.result }}"
            echo "Docs: ${{ needs.docs.result }}"
            echo "Version Check: ${{ needs.version-check.result }}"
            exit 1
          fi
          echo "All checks passed"
