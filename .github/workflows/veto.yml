name: Veto

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  lint:
    uses: ./.github/workflows/lint.yml

  security:
    uses: ./.github/workflows/security.yml

  docs:
    uses: ./.github/workflows/docs.yml

  version-check:
    uses: ./.github/workflows/version-check.yml
    with:
      skip: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-version-bump') }}

  veto:
    name: Veto
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs: [ci, lint, security, docs, version-check]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check results
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py --allow-skipped version-check <<< "$CI_JOB_RESULTS"
